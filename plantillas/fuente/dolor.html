<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla Dolor</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .lienzo {
    background:
      radial-gradient(circle at 92% 8%, rgba(51,122,183,.55) 0, rgba(51,122,183,0) 38%),
      linear-gradient(140deg, var(--azul-oscuro) 0%, var(--azul-medio) 60%, #1D5A92 100%);
  }
  /* Circuitos decorativos */
  .circuito { position: absolute; right: -40px; top: 120px; opacity: .07; }

  .etiqueta {
    position: absolute; top: 70px; right: 64px;
    padding: 14px 26px; font-size: 24px;
    color: #fff; border: 2px solid rgba(255,255,255,.35);
  }
  .zona-gancho { color: #fff; }
  .zona-gancho .ejemplo span { color: #7FB8E8; }

  .pie {
    position: absolute; left: 64px; right: 64px; bottom: 64px; height: 170px;
    background: #fff; border-radius: 28px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }
  .pie h3 { font-size: 38px; font-weight: 800; color: var(--azul-oscuro); }
  .pie p { font-size: 24px; font-weight: 500; color: #4B5563; margin-top: 6px; }
  .boton { background: var(--verde); color: #fff; font-size: 28px; padding: 24px 36px; }
</style>
</head>
<body>
<div class="lienzo">
  <img class="logo" src="logo_blanco.png" alt="Storedimo">
  <div class="pildora etiqueta">Inventario en la nube</div>

  <svg class="circuito" width="520" height="520" viewBox="0 0 520 520" fill="none" stroke="#fff" stroke-width="6">
    <path d="M60 80 H300 V220 H460"/><circle cx="460" cy="220" r="16"/>
    <path d="M60 180 H200 V360 H420"/><circle cx="420" cy="360" r="16"/>
    <path d="M60 280 H120 V460 H300"/><circle cx="300" cy="460" r="16"/>
    <circle cx="60" cy="80" r="16"/><circle cx="60" cy="180" r="16"/><circle cx="60" cy="280" r="16"/>
  </svg>

  <div class="zona-gancho">
    <div class="ejemplo">¿Sabes cuánta plata pierdes al mes en <span>productos vencidos?</span></div>
  </div>

  <div class="pie">
    <div>
      <h3>Prueba gratis 15 días</h3>
      <p>storedimoapp.softdimo.com</p>
    </div>
    <div class="pildora boton">Empieza gratis →</div>
  </div>
</div>
<script>if (location.search.includes('preview')) document.body.classList.add('preview');</script>
</body>
</html>
