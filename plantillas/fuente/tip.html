<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plantilla Tip</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .lienzo { background: var(--claro); }
  .franja { position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: var(--azul); }
  .puntos {
    position: absolute; right: 0; top: 0; width: 420px; height: 420px;
    background-image: radial-gradient(rgba(51,122,183,.22) 3px, transparent 3px);
    background-size: 34px 34px;
    -webkit-mask-image: linear-gradient(225deg, #000 20%, transparent 75%);
  }
  .etiqueta {
    position: absolute; top: 210px; left: 90px;
    padding: 14px 28px; font-size: 26px; letter-spacing: 2px;
    background: var(--azul); color: #fff;
  }
  .zona-gancho { color: var(--texto); }
  .zona-gancho .ejemplo span { color: var(--azul); }

  .pie {
    position: absolute; left: 90px; right: 64px; bottom: 70px; height: 150px;
    display: flex; align-items: flex-end; justify-content: space-between;
    border-top: 3px solid #DDE5EF; padding-top: 30px;
  }
  .pie h3 { font-size: 34px; font-weight: 800; color: var(--azul-oscuro); }
  .pie p { font-size: 24px; font-weight: 500; color: #4B5563; margin-top: 6px; }
  .barras { display: flex; align-items: flex-end; gap: 14px; height: 110px; }
  .barras div { width: 34px; border-radius: 8px 8px 0 0; background: var(--azul); }
  .barras div:nth-child(odd) { background: #9CC3E6; }
  .barras .alerta { background: #E05A47 !important; }
</style>
</head>
<body>
<div class="lienzo">
  <div class="franja"></div>
  <div class="puntos"></div>
  <img class="logo" src="logo_azul.png" alt="Storedimo">
  <div class="pildora etiqueta">TIP DE INVENTARIO</div>

  <div class="zona-gancho">
    <div class="ejemplo">Revisa primero lo que <span>más vendes</span>: el 20% de tus productos mueve el 80% de tu plata.</div>
  </div>

  <div class="pie">
    <div>
      <h3>Controla tu stock desde el celular</h3>
      <p>Prueba gratis · storedimoapp.softdimo.com</p>
    </div>
    <div class="barras">
      <div style="height:55%"></div><div style="height:85%"></div><div style="height:70%"></div>
      <div style="height:100%"></div><div class="alerta" style="height:22%"></div>
    </div>
  </div>
</div>
<script>if (location.search.includes('preview')) document.body.classList.add('preview');</script>
</body>
</html>
